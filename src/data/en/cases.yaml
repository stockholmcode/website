  body: >-
    Built WBD's new global streaming platform — Discovery+ and HBO Max/MAX. POC in three weeks,
    then chief architects and lead developers as the team scaled to 1000+ devs. Event-driven
    microservices, non-blocking and with no external runtime dependencies.
  metric: 13ms
  metricLabel: avg API response time
  secondary:
