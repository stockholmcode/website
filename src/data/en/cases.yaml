- client: SL
  sector: Public transport
  sectorKey: public
  outcome: New ticketing system with contactless
  body: >-
    Architecture and delivery of SL's new ticketing system — built from scratch on AWS, with SCG
    leading the software architecture. Travel with a bank card, automatic discounts for
    students/seniors, accessibility features. AWS wrote a blog post about the project.
  metric: 800k
  metricLabel: journeys / day
  secondary:
    - num: EMV
      label: contactless payment
    - num: AWS
      label: EC2, RDS, KMS
    - num: PCI
      label: compliant
  stack:
    - EMV contactless
    - AWS
    - PCI-compliant
  year: '2023'
  role: Chief Software Architect
  period: 2020 – 2023
  expanded:
    summary: >-
      SL's new ticketing system — contactless payment with bank cards, automatic discounts, built from
      scratch on AWS. SCG led the software architecture throughout.
    sections:
      - h: Background
        body: >-
          Stockholm's public transport needed to replace its ageing ticketing system with a solution
          that handles 800,000 journeys a day — and gives travellers a far smoother experience. The
          demands on operations, security and accessibility in a critical public service are hard and
          non-negotiable.
      - h: What we did
        body: >-
          SCG led the architecture as chief software architect. The system was built
          from scratch on AWS with EMV contactless as the primary payment method — travel with your bank
          card, automatic discounts for students and seniors, accessibility features baked in from the
          start. PCI-compliant and designed to handle peak hours without compromising on performance.
      - h: Result
        body: >-
          800,000 journeys per day, EMV-based contactless as standard, full PCI compliance.
          AWS wrote its own blog post about the project as a reference implementation for the public
          sector's transition to modern cloud infrastructure.
    source:
      label: Read the AWS blog post →
      href: https://aws.amazon.com/blogs/publicsector/stockholm-public-transport-transforms-ticketing-system-with-aws-cloud/
    stackList:
      - AWS (EC2, RDS, KMS)
      - EMV contactless
      - PCI-compliant
      - Accessibility features
