    - Event-driven
    - Microservices
    - Lead architects
    - Global scale
  year: '2023'
  role: Chief architects · Lead developers
  period: 2019 – 2023
  expanded:
    summary: >-
      From POC to global streaming platform for Warner Bros. Discovery — Discovery+ and HBO
      Max/MAX, built from the ground up to handle global peaks without losing control of cost
      or latency.
    sections:
      - h: Background
        body: >-
          WBD needed a new global streaming platform that could deliver Discovery+ and later HBO
          Max/MAX to an audience measured in hundreds of millions. The existing architecture could
          not handle that scale, and the timeline was uncompromising.
      - h: What we did
        body: >-
          A three-week POC confirmed the direction. From there SCG stepped in as chief architects and
          lead developers as the team scaled from a dozen to over 1000 developers. Event-driven
          microservices, non-blocking IO, no external runtime dependencies — so that every service
          could be operated, scaled and debugged in isolation.
      - h: Result
        body: >-
          13ms average API response time, 80 million API calls per day, 99.9999% uptime and 3 200 peak
          requests per second. The platform handles global peaks without losing control of cost or
          latency, and the development team can iterate service by service without coordination
          nightmares.
    stackList:
      - Event-driven microservices
      - Non-blocking IO
      - Global scaling
      - Lead architects from SCG
