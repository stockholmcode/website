- client: Blocket
  sector: Marketplace
  sectorKey: marketplace
  outcome: Monolith → microservices with no downtime
  body: >-
    SCG drove Blocket's transformation from a large legacy monolith into well-defined microservices
    with clear boundaries. Architects, developers and a product manager — all the way from planning
    to delivery. Event-driven on Kafka, event sourcing via DynamoDB streams, onion architecture.
  metric: Kafka
  metricLabel: event-driven
  secondary:
    - num: Kotlin
      label: Spring Boot · K8s
    - num: Aurora
      label: PostgreSQL + DynamoDB
    - num: Onion
      label: Hexagonal architecture
  stack:
    - Kotlin · Spring Boot
    - Kafka
    - Aurora · DynamoDB
    - Onion / Hexagonal
  year: '2024'
  role: Architects, developers, product manager
  period: 2022 – 2024
  testimonial:
    quote: >-
      The consultants from Stockholm Code Group truly stand out. They bring remarkable
      technical expertise and seniority, and are dedicated to delivering effective and modern
      solutions.
    name: Niklas Lager
    role: CTO, Blocket
  expanded:
    summary: >-
      Transformation of Blocket's large legacy monolith into well-defined microservices —
      event-driven, with no downtime, with a team that covered the whole path from planning to
      delivery.
    sections:
      - h: Background
        body: >-
          Blocket ran an extensive legacy monolith that had grown over several decades. It was
          stable but had become a brake on development pace — every change required coordination,
          deploys were rare events, and new ideas ended up in a queue.
      - h: What we did
        body: >-
          SCG drove the transformation from monolith to well-defined microservices with clear
          boundaries, without Blocket having to stand still. We staffed architects, developers and a
          product manager — all the way from planning to delivery. Event-driven on Kafka, event
          sourcing via DynamoDB streams, onion and hexagonal architecture so that domain logic and
          infrastructure can evolve independently of each other.
      - h: Result
        body: >-
          Clearly bounded services in Kotlin on Spring Boot and Kubernetes, Aurora PostgreSQL and
          DynamoDB as data stores, Kafka as the backbone for all asynchronous communication. The team
          can now ship changes more often and with less coordination — and the next generation of
          Blocket is no longer an impossible refactor.
    stackList:
      - Kotlin · Spring Boot · Kubernetes
      - Aurora PostgreSQL · DynamoDB
      - Kafka · event sourcing
      - Onion / Hexagonal architecture
- client: Matsmart / Motatos
  sector: E-commerce
  sectorKey: ecom
  outcome: Core platform modernisation with agentic AI
  body: >-
    Helped Matsmart/Motatos modernise their legacy platform and enable a small team to
    deliver above its weight class with an agentic AI way of working. Service architecture
    redesigned, hand-maintained components replaced with managed alternatives, parallel POC services
    alongside existing flows.
  metric: 5–8k
  metricLabel: orders/day (SE)
  secondary:
    - num: '6'
      label: European markets
    - num: Azure
      label: Service Bus · IaC
    - num: Agentic
      label: AI workflows
  stack:
    - Azure Service Bus
    - GitHub Actions
    - Infrastructure as Code
    - .NET / C#
    - Agentic AI
  year: '2026'
  role: Architect and Developer
  period: 2025 – 2026
  expanded:
    summary: >-
      Matsmart/Motatos modernised its core platform in stages while keeping orders flowing
      across six European markets.
    sections:
      - h: Background
        body: >-
          Matsmart/Motatos sells surplus food across six European markets, handling 5,000–8,000
          orders a day in Sweden. Its custom framework and hand-maintained services were slowing
          development, but the platform had to keep running throughout the migration. Order,
          stock and warehouse integrations made a single cutover impractical.
      - h: What we did
        body: >-
          SCG redesigned the service architecture so new services could run alongside the old
          framework. The team moved messaging to Azure Service Bus and CI/CD to GitHub Actions,
          while adding shared AI workflows and current documentation to the repository. Versioned
          skills gave the whole team a clearer view of deployments across services.
      - h: Result
        body: >-
          Leaner services and managed infrastructure reduced maintenance and deployment work.
          Data flows could move gradually without a single cutover, and shared AI tooling helped
          the small team work across the platform.
    stackList:
      - Azure Service Bus — managed event-driven messaging
      - GitHub Actions — CI/CD and collaboration
      - Infrastructure as Code — fully decoupled services
      - Lightweight service architecture — minimal setup per service
      - Agentic AI workflows — team-scaled, not solo
      - AI-maintained documentation
