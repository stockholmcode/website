- num: '01'
  title: Code before consulting talk.
  body: >-
    We ship code in production. Not slides, not PowerPoints, not workshops that lead to more
    workshops.
- num: '02'
  title: Knowledge sharing.
  body: >-
    Book and video club, dedicated AI days, pair programming and lunch talks. Nobody knows everything
    — we learn from each other.
- num: '03'
  title: Flat organisation.
  body: Short decision paths, trust in each other's expertise. No needless bureaucracy or politics.
- num: '04'
  title: Senior only.
  body: >-
    Clients pay for senior engineers and get senior engineers. We don't take shortcuts at anyone's
    expense.
- num: '05'
  title: Together in Stockholm.
  body: >-
    We sit where we're needed at the client — but always meet at the office on Regeringsgatan 74 when
    it suits.
- num: '06'
  title: Influence & wellbeing.
  body: >-
    Monthly staff meetings, conferences, after work. Anyone who wants to help shape clients and
    direction — that's possible.
