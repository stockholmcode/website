- num: '01'
  title: AI-scan
  kicker: Vill ha klarhet först?
  body: >-
    Halvdag tillsammans. Vi kartlägger var ni står på fem AI-mognads­dimensioner och ger er en 1–2
    sidors sammanfattning. Scan-avgiften kvittas om ni fortsätter.
  bullets:
    - Halvdag
    - Fast pris
    - Ingen bindning
  when: Halvdag
- num: '02'
  title: AI-readiness Assessment
  kicker: Redo att diagnostisera?
  body: >-
    Full 5-dimensionell diagnos — kodbas, infra, data, team, leverans. Rött / gult / grönt per
    dimension. Skriftlig rapport, stakeholder-presentation och konkret roadmap.
  bullets:
    - 3–4 veckor
    - Fast pris
    - Skriftlig rapport
  when: 3–4 v
- num: '03'
  title: AI-implementation
  kicker: Har en roadmap?
  body: >-
    Fem moduler som mappar direkt mot assessmentens dimensioner. Kodbas · infrastruktur · data ·
    team-enablement · affärsprocess. Ta en modul eller kombinera flera.
  bullets:
    - 5 moduler
    - T&M eller fast scope
    - Modulärt
  when: 5 moduler
- num: '04'
  title: AI-native utveckling
  kicker: Behöver bygga nu?
  body: >-
    Er löpande teknikpartner — seniora ingenjörer som har AI som förvald arbetssätt. 3–5× snabbare
    leverans. Konsulter per timme, dedikerat team, eller fraktionell CTO.
  bullets:
    - Timkonsult · Team · Fractional CTO
    - 3–5× snabbare
    - Löpande
  when: Löpande
