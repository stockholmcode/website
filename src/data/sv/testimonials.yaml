- quote: >-
    Konsulterna från Stockholm Code Group sticker verkligen ut. De bidrar med anmärkningsvärd
    teknisk expertis och seniority, och är dedikerade till att leverera effektiva och moderna
    lösningar. Deras insats har varit avgörande för Blockets framtida framgång.
  name: Niklas Lager
  role: CTO, Blocket
  avatar: blocket.jpg
- quote: >-
    Stockholm Code Group har bemannat flera av nyckelpersonerna i det här projektet. Genomgående
    har deras konsulter haft en kompetensnivå, leveransförmåga och ett kvalitetstänk som ligger
    klart över genomsnittet. De är enkla och trevliga att samarbeta med, proaktiva och vågar säga
    emot när det behövs.
  name: Pontus Hellgren
  role: VP Engineering, Warner Bros. Discovery
  avatar: warner_bros.svg.webp
- quote: >-
    Stockholm Code Group har varit en hörnsten i utvecklingen av Custellence ända från början. Det
    märks att de verkligen brinner för teknik och bryr sig om kvaliteten i sitt arbete.
  name: Olof Bendt
  role: CTO, Custellence
  avatar: custellence.jpg
- quote: >-
    Vi har sällan sett ett så effektivt team med så mycket domänkunskap. Teamets agility och tempo
