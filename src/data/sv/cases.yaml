- client: Warner Bros. Discovery
  sector: Media & streaming
  sectorKey: streaming
  outcome: Ny streamingplattform från grunden
  body: >-
    Byggde WBD:s nya globala streamingplattform — Discovery+ och HBO Max/MAX. POC på tre veckor,
    sedan huvudarkitekter och lead-utvecklare när teamet skalade till 1000+ devs. Event-driven
    microservices, icke-blockerande och utan externa runtime-beroenden.
  metric: 13ms
  metricLabel: snitt API-svarstid
  secondary:
    - num: 80M
      label: API-anrop / dag
    - num: 99.9999%
      label: API-uptime
    - num: 3 200
      label: peak req/s
  stack:
    - Event-driven
    - Microservices
    - Lead-arkitekter
    - Global skala
  year: '2023'
  role: Chief architects · Lead developers
  period: 2019 – 2023
  expanded:
    summary: >-
      Från POC till global streamingplattform för Warner Bros. Discovery — Discovery+ och HBO
      Max/MAX, byggd från grunden för att klara globala peaks utan att tappa kontroll över kostnader
      eller latens.
    sections:
      - h: Bakgrund
        body: >-
          WBD behövde en ny global streamingplattform som kunde leverera Discovery+ och senare HBO
          Max/MAX till en publik som mäts i hundratals miljoner. Den befintliga arkitekturen klarade
          inte den skalan, och tidsplanen var kompromisslös.
      - h: Vad vi gjorde
        body: >-
          Tre veckors POC bekräftade riktningen. Därifrån klev SCG in som huvudarkitekter och
          lead-utvecklare när teamet skalade från ett tiotal till över 1000 utvecklare. Event-driven
          microservices, icke-blockerande IO, inga externa runtime-beroenden — så att varje tjänst
          kunde driftas, skalas och felsökas isolerat.
      - h: Resultat
        body: >-
          13ms snitt API-svarstid, 80 miljoner API-anrop per dag, 99.9999% uptime och 3 200 peak
          requests per sekund. Plattformen klarar globala peaks utan att tappa kontroll över
          kostnader eller latens, och utvecklingsteamet kan iterera tjänst för tjänst utan
          koordinationsmardrömmar.
    stackList:
      - Event-driven microservices
      - Icke-blockerande IO
      - Global skalning
      - Lead-arkitekter från SCG
    quote: null
- client: SL
  sector: Kollektivtrafik
  sectorKey: public
  outcome: Nytt biljettsystem med contactless
  body: >-
    Arkitektur och leverans av SLs nya biljettsystem — byggt från grunden på AWS, med SCG
    som ansvarig för mjukvaruarkitekturen. Res med bankkort, automatiska rabatter för
    studenter/seniorer, tillgänglighetsfunktioner. AWS skrev en blogpost om projektet.
  metric: 800k
  metricLabel: resor / dag
  secondary:
    - num: EMV
      label: contactless-betalning
    - num: AWS
      label: EC2, RDS, KMS
    - num: PCI
      label: compliant
  stack:
    - EMV contactless
    - AWS
    - PCI-compliant
  year: '2023'
  role: Chief Software Architect
  period: 2020 – 2023
  expanded:
    summary: >-
      SLs nya biljettsystem — contactless-betalning med bankkort, automatiska rabatter, byggt från
      grunden på AWS. SCG ledde mjukvaruarkitekturen genom hela projektet.
    sections:
      - h: Bakgrund
        body: >-
          Stockholms lokaltrafik behövde ersätta sitt åldrande biljettsystem med en lösning som tål
          800 000 resor per dygn — och som ger resenärerna en betydligt smidigare upplevelse. Kraven
          på drift, säkerhet och tillgänglighet i en kritisk samhällstjänst är hårda och
          oförhandlingsbara.
      - h: Vad vi gjorde
        body: >-
          SCG ledde arkitekturen som chief software architect. Systemet byggdes
          från grunden på AWS med EMV contactless som primär betalmetod — res med ditt bankkort,
          automatiska rabatter för studenter och seniorer, tillgänglighetsfunktioner inbakade från
          start. PCI-compliant och designat för att hantera peak hours utan vänlighet på prestanda.
      - h: Resultat
        body: >-
          800 000 resor per dag, EMV-baserad contactless som standard, fullständig PCI-compliance.
          AWS skrev en egen blogpost om projektet som referensimplementation för publika sektorns
          övergång till modern molninfrastruktur.
    source:
      label: Läs AWS blogginlägg →
      href: https://aws.amazon.com/blogs/publicsector/stockholm-public-transport-transforms-ticketing-system-with-aws-cloud/
    stackList:
      - AWS (EC2, RDS, KMS)
      - EMV contactless
      - PCI-compliant
      - Tillgänglighetsfunktioner
    quote: null
- client: Blocket
  sector: Marketplace
  sectorKey: marketplace
  outcome: Monolit → microservices utan driftstopp
  body: >-
    SCG drev Blockets transformation från en stor legacy-monolit till väldefinierade microservices
    med tydliga gränser. Arkitekter, utvecklare och en product manager — hela vägen från planering
    till leverans. Event-driven på Kafka, event sourcing via DynamoDB-streams, onion-arkitektur.
  metric: Kafka
  metricLabel: event-driven
  secondary:
    - num: Kotlin
      label: Spring Boot · K8s
    - num: Aurora
      label: PostgreSQL + DynamoDB
    - num: Onion
      label: Hexagonal arkitektur
  stack:
    - Kotlin · Spring Boot
    - Kafka
    - Aurora · DynamoDB
    - Onion / Hexagonal
  year: '2024'
  role: Arkitekter, utvecklare, product manager
  period: 2022 – 2024
  testimonial:
    quote: >-
      Konsulterna från Stockholm Code Group sticker verkligen ut. De bidrar med anmärkningsvärd
      teknisk expertis och seniority, och är dedikerade till att leverera effektiva och moderna
      lösningar.
    name: Niklas Lager
    role: CTO, Blocket
  expanded:
    summary: >-
      Transformation av Blockets stora legacy-monolit till väldefinierade microservices —
      event-driven, utan driftstopp, med ett team som täckte hela vägen från planering till
      leverans.
    sections:
      - h: Bakgrund
        body: >-
          Blocket körde en omfattande legacy-monolit som hade vuxit över flera decennier. Den var
          stabil men hade blivit en bromskloss för utvecklingstakten — varje förändring krävde
          koordination, deploys var sällsynta händelser, och nya idéer hamnade i kö.
      - h: Vad vi gjorde
        body: >-
          SCG drev transformationen från monolit till väldefinierade microservices med tydliga
          gränser, utan att Blocket behövde stå stilla. Vi bemannade arkitekter, utvecklare och en
          product manager — hela vägen från planering till leverans. Event-driven på Kafka, event
          sourcing via DynamoDB-streams, onion- och hexagonal arkitektur så att domänlogik och
          infrastruktur kan utvecklas oberoende av varandra.
      - h: Resultat
        body: >-
          Tydligt avgränsade tjänster i Kotlin på Spring Boot och Kubernetes, Aurora PostgreSQL och
          DynamoDB som datalager, Kafka som backbone för all asynkron kommunikation. Teamet kan nu
          släppa förändringar oftare och med mindre koordination — och nästa generations Blocket är
          inte längre en omöjlig refaktor.
    stackList:
      - Kotlin · Spring Boot · Kubernetes
      - Aurora PostgreSQL · DynamoDB
      - Kafka · event sourcing
      - Onion / Hexagonal arkitektur
- client: Matsmart / Motatos
  sector: E-handel
  sectorKey: ecom
  outcome: Modernisering av kärnplattform med agentic AI
  body: >-
    Hjälpte Matsmart/Motatos modernisera sin legacy-plattform och möjliggöra för ett litet team att
    leverera över sin viktklass med ett agentic AI-baserat arbetssätt. Service-arkitektur
    omdesignad, hand-underhållna komponenter ersatta med managed alternativ, parallella POC-tjänster
    bredvid existerande flöden.
  metric: 5–8k
  metricLabel: ordrar/dag (SE)
  secondary:
    - num: '6'
      label: europeiska marknader
    - num: Azure
      label: Service Bus · IaC
    - num: Agentic
      label: AI-workflows
  stack:
    - Azure Service Bus
    - GitHub Actions
    - Infrastructure as Code
    - .NET / C#
    - Agentic AI
  year: '2026'
  role: Architect and Developer
  period: 2025 – 2026
  expanded:
    summary: >-
      Matsmart/Motatos moderniserade sin kärnplattform stegvis medan orderflödena fortsatte
      i sex europeiska länder.
    sections:
      - h: Bakgrund
        body: >-
          Matsmart/Motatos säljer överskottsmat i sex europeiska länder, med 5 000–8 000
          ordrar per dag i Sverige. Det egenbyggda ramverket och de manuellt underhållna
          tjänsterna bromsade utvecklingen, men plattformen behövde vara i drift under migreringen.
          Integrationer för order, lager och leveranser gjorde ett enda byte opraktiskt.
      - h: Vad vi gjorde
        body: >-
          SCG ritade om tjänstearkitekturen så att nya tjänster kunde köras parallellt med det
          gamla ramverket. Teamet flyttade meddelandeflöden till Azure Service Bus och CI/CD till
          GitHub Actions samt lade till gemensamma AI-arbetsflöden och aktuell dokumentation i repot.
          Versionshanterade skills gav hela teamet bättre överblick över driftsättningar.
      - h: Resultat
        body: >-
          Lättare tjänster och hanterad infrastruktur minskade underhållet och arbetet med
          driftsättning. Dataflöden kunde flyttas stegvis utan ett enda byte, och gemensamma
          AI-verktyg hjälpte det lilla teamet att arbeta över hela plattformen.
    stackList:
      - Azure Service Bus — managed event-driven messaging
      - GitHub Actions — CI/CD och samarbete
      - Infrastructure as Code — fullt frikopplade tjänster
      - Lättviktig service-arkitektur — minimal setup per tjänst
      - Agentic AI workflows — team-skalad, inte solo
      - AI-underhållen dokumentation
