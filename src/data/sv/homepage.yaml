offerings:
  eyebrow: № 02 — Vad vi gör
  headline1: Senior kompetens.
  headline2: Skarpa leveranser.
  lead: >-
    Vi bygger system, team och ledarskap — arkitektur, teknisk due diligence, fractional CTO.
    AI-readiness är en specialism, inte allt vi gör.
  corePracticeLabel: CORE PRACTICE
  corePractice:
    - num: A
      title: Stora initiativ
      body: >-
        Dedikerade team inbäddade hos kunden med fullt ansvar för leveransen — från
        arkitektur till produktion.
      tags: [Dedikerat team, Outcome, Egen lead]
    - num: B
      title: Timkonsulting
      body: >-
        Seniora konsulter som förstärker befintliga team. Enskilda profiler där ni behöver
        tyngd, i er stack.
      tags: [Förstärkning, Senior nivå, Er stack]
    - num: C
      title: Rådgivning
      body: >-
        Teknisk rådgivning inom arkitektur, kodkvalitet och strategisk planering — ofta som
        del av M&A due diligence.
      tags: [Arkitektur, Kodkvalitet, M&A DD]
  aiTrack:
    eyebrow: Specialism · AI-readiness track
    headline: Klarhet → Diagnos → Exekvering → Löpande
    body: >-
      Fyra fokuserade steg när AI behöver struktur — inte bara verktyg. Varje steg står på
      egna ben; börja där ni är.
    cta: { label: "Se ramverket →", to: /offering }
  allCta: { label: "Alla erbjudanden i detalj →", to: /offering }

