hero:
  kicker: STOCKHOLM CODE GROUP · SEDAN 2007
  headlinePre: We bring
  headlineAccent: love
  headlineMid: to
  typedWords: ["software.", "customers.", "teams.", "code.", "product.", "Stockholm."]
  lead: >-
    Ett handplockat team av seniora ingenjörer och arkitekter. I Stockholm, sedan 2007.
    Vi bygger plattformar, moderniserar arkitektur och tar komplexa leveranser i mål —
    med AI som accelerator där det skapar värde.
  ctaPrimary: { label: "Börja ett samtal →", href: "mailto:contactus@stockholmcode.se" }
