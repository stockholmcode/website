- num: '01'
  title: Kod före konsultprat.
  body: >-
    Vi levererar kod i produktion. Inte slides, inte powerpoints, inte workshops som leder till fler
    workshops.
- num: '02'
  title: Kunskaps­delning.
  body: >-
    Bok- och videoklubb, dedikerade AI-dagar, parkodning och lunchprat. Ingen vet allt — vi lär av
    varandra.
- num: '03'
  title: Platt organisation.
  body: Korta beslutsvägar, förtroende för varandras expertis. Ingen onödig byråkrati eller politik.
- num: '04'
  title: Enbart seniora.
  body: >-
    Kunder betalar för seniora ingenjörer och får seniora ingenjörer. Vi tar inte genvägar på någons
    bekostnad.
- num: '05'
  title: Tillsammans i Stockholm.
  body: >-
    Vi sitter där vi behövs hos kund — men träffas alltid på kontoret på Regeringsgatan 74 när det
    passar.
- num: '06'
  title: Påverkan & trivsel.
  body: >-
    Månadsvisa personalmöten, konferenser, after work. Den som vill vara med och påverka kunder och
    riktning — det går.
