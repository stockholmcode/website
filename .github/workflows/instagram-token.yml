name: Refresh Instagram token

# Long-lived Instagram tokens expire after 60 days. Refreshing weekly keeps the
# INSTAGRAM_ACCESS_TOKEN secret valid; a failed run here means the token needs
# to be regenerated by hand (see README). When this finishes, the deploy
# workflow runs and pulls the latest posts with the refreshed token.
on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh Instagram token
        run: node scripts/refresh-instagram-token.mjs
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.INSTAGRAM_SECRET_WRITE_TOKEN }}
