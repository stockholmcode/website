name: Deploy to GitHub Pages

# Build runs on every push and PR (proves the site compiles).
# Deploy happens on a push to `main` or a manual dispatch, and only takes
# effect once the repo's Pages source is set to "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: .cache/instagram
          key: instagram-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: instagram-
      - name: Update Instagram feed and token
        if: github.event_name != 'pull_request'
        run: node scripts/sync-instagram.mjs
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.INSTAGRAM_SECRET_WRITE_TOKEN }}
      - run: npm run build
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: .cache/instagram
          key: instagram-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
