name: Deploy to GitHub Pages

# Build runs on every push and PR (proves the site compiles).
# Deploy happens on the deploy branches or a manual dispatch, and only takes
# effect once the repo's Pages source is set to "GitHub Actions".
# During the migration we deploy from `feature/translation`; once the migration
# lands, `main` becomes the production deploy source (drop feature/translation then).
on:
  push:
    branches: [main, feature/translation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
