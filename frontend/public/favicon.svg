<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)" stroke="#fff" stroke-width="1"/>
  
  <!-- CLE text -->
  <text x="16" y="12" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">CLE</text>
  
  <!-- Small book/learning icon -->
  <rect x="12" y="18" width="8" height="6" fill="white" rx="1"/>
  <line x1="13" y1="20" x2="19" y2="20" stroke="#667eea" stroke-width="0.5"/>
  <line x1="13" y1="21.5" x2="17" y2="21.5" stroke="#667eea" stroke-width="0.5"/>
</svg>