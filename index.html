<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stockholm Code Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0A0C0F; scroll-behavior: smooth; }
  body { font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; color: #E6EAF0; }
  * { box-sizing: border-box; }
  [id="erbjudanden"], [id="case"], [id="team"], [id="karriar"] { scroll-margin-top: 24px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="content-loader.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="variant-warm-slim.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function App() {
  const sections = {
    hero: true, logos: true, offerings: true, cases: true,
    approach: true, testimonials: true, team: true, careers: true, footer: true,
  };
  return (
    <div data-scg>
      <window.VariantWarmSlim density="compact" tone="confident" sections={sections} />
    </div>
  );
}
window.SCG_CONTENT_READY.then(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script>
</body>
</html>
